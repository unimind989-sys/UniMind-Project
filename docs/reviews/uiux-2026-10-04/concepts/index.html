<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UniMind — proposed experience</title>
    <style>
      @font-face {
        font-family: Manrope;
        src: url(assets/manrope.woff2) format("woff2");
        font-weight: 200 800;
        font-display: swap;
      }
      :root {
        --canvas: #f6f7f8;
        --surface: #fff;
        --subtle: #eef0f2;
        --ink: #202124;
        --secondary: #535861;
        --muted: #626873;
        --border: #d9dde3;
        --control: #777f8b;
        --blue: #2458b8;
        --soft: #e8effb;
        --green: #236746;
        --amber: #795019;
        --red: #a32723;
        --focus: #2458b8;
      }
      :root[data-theme="dark"] {
        --canvas: #1b1c1f;
        --surface: #232529;
        --subtle: #2c2e33;
        --ink: #eef0f3;
        --secondary: #bdc2cb;
        --muted: #a6acb7;
        --border: #3e424a;
        --control: #858d9a;
        --blue: #adc7ff;
        --soft: #2b3c59;
        --green: #91d2ad;
        --amber: #eed29a;
        --red: #ffb4ab;
        --focus: #adc7ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.6 Manrope,
          Arial,
          sans-serif;
        color: var(--ink);
        background: var(--canvas);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        outline-offset: 3px;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--focus);
      }
      [hidden] {
        display: none !important;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        line-height: 1.35;
        letter-spacing: -0.035em;
        font-weight: 650;
      }
      h2 {
        font-size: 19px;
        line-height: 1.45;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      h3 {
        font-size: 15px;
        font-weight: 650;
      }
      p {
        color: var(--secondary);
      }
      small,
      .meta {
        font-size: 12px;
        color: var(--muted);
      }
      .review {
        height: 44px;
        padding: 0 20px;
        background: #202124;
        color: #fff;
        display: flex;
        gap: 16px;
        align-items: center;
        font:
          12px/1.3 Arial,
          sans-serif;
      }
      .review strong {
        font-weight: 600;
      }
      .review select {
        padding: 4px 8px;
        background: #303237;
        color: white;
        border: 1px solid #717782;
        border-radius: 4px;
      }
      .review .grow {
        flex: 1;
      }
      .review a {
        color: #adc7ff;
      }
      .review button {
        background: none;
        border: 1px solid #717782;
        color: white;
        padding: 4px 12px;
        border-radius: 4px;
      }
      .app {
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr);
        min-height: calc(100svh - 44px);
      }
      .rail {
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 26px 14px 20px;
        gap: 24px;
        background: var(--canvas);
      }
      .brand {
        display: flex;
        gap: 9px;
        align-items: center;
        color: var(--ink);
        font-size: 19px;
        font-weight: 750;
        letter-spacing: -0.6px;
        padding: 0 10px;
      }
      .brand img {
        width: 29px;
        height: 29px;
      }
      .rail nav {
        display: grid;
        gap: 3px;
      }
      .rail nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        color: var(--secondary);
        padding: 9px 12px;
        border-radius: 6px;
      }
      .rail nav a.active {
        color: var(--blue);
        background: var(--soft);
        font-weight: 650;
      }
      .rail-label {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0 12px;
        margin-bottom: 8px;
      }
      .nav-mark {
        font-size: 17px;
        line-height: 1;
        width: 20px;
        text-align: center;
        font-weight: 500;
      }
      .rail-note {
        margin-top: auto;
        padding: 16px 10px;
        border-top: 1px solid var(--border);
      }
      .rail-note strong {
        font-size: 12px;
        display: block;
      }
      .rail-note p {
        font-size: 12px;
        margin-top: 6px;
      }
      .main {
        min-width: 0;
      }
      .utility {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 32px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .utility .crumb {
        color: var(--secondary);
        font-size: 12px;
        flex: 1;
      }
      .role {
        border-left: 1px solid var(--border);
        padding-left: 16px;
        font-size: 12px;
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .role .avatar {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border: 1px solid var(--border);
        border-radius: 50%;
        font-size: 10px;
        color: var(--blue);
        background: var(--soft);
      }
      .lang {
        background: none;
        border: none;
        color: var(--secondary);
        padding: 8px;
        min-height: 40px;
      }
      .content {
        padding: 28px 32px;
        max-width: 1360px;
        margin: auto;
      }
      .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }
      .heading p {
        margin-top: 6px;
        font-size: 13px;
      }
      .btn {
        border: 1px solid var(--control);
        background: var(--surface);
        border-radius: 6px;
        min-height: 44px;
        padding: 9px 15px;
        font-weight: 600;
        font-size: 13px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        color: var(--ink);
        transition:
          background 140ms ease,
          color 140ms ease;
      }
      .btn:hover {
        background: var(--subtle);
        text-decoration: none;
      }
      .btn.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      :root[data-theme="dark"] .btn.primary {
        color: #152646;
      }
      .btn.quiet {
        border-color: transparent;
        background: transparent;
        color: var(--secondary);
      }
      .btn.danger {
        border-color: var(--red);
        color: var(--red);
      }
      .badge {
        font-size: 12px;
        display: inline-flex;
        gap: 6px;
        align-items: center;
        color: var(--green);
      }
      .badge:before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
      }
      .badge.warn {
        color: var(--amber);
      }
      .badge.blocked {
        color: var(--red);
      }
      .eyebrow {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 600;
        color: var(--muted);
      }
      .section-top {
        display: flex;
        align-items: center;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .field {
        display: grid;
        gap: 6px;
        font-size: 12px;
        color: var(--secondary);
      }
      input,
      select,
      textarea {
        background: var(--surface);
        border: 1px solid var(--control);
        border-radius: 6px;
        padding: 10px 12px;
        min-height: 44px;
      }
      textarea {
        resize: vertical;
        line-height: 1.6;
      }
      .divider {
        border-top: 1px solid var(--border);
      }
      .shelf-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 264px;
        gap: 32px;
      }
      .resume {
        padding: 20px 0 24px;
        border-top: 2px solid var(--blue);
        border-bottom: 1px solid var(--border);
        margin-bottom: 26px;
        display: flex;
        align-items: center;
        gap: 24px;
        justify-content: space-between;
      }
      .resume h2 {
        margin: 8px 0 4px;
      }
      .resume p {
        font-size: 13px;
      }
      .search {
        width: 240px;
      }
      .subject-list {
        background: var(--surface);
        border-block: 1px solid var(--border);
      }
      .subject {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 80px;
        padding: 16px 20px;
      }
      .subject + .subject {
        border-top: 1px solid var(--border);
      }
      .subject:hover {
        background: var(--subtle);
      }
      .subject .num {
        width: 28px;
        flex-shrink: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .subject a.title {
        font-weight: 650;
        color: var(--ink);
        font-size: 15px;
      }
      .subject .copy {
        flex: 1;
      }
      .subject .copy p {
        font-size: 12px;
        margin-top: 2px;
      }
      .subject .arrow {
        min-width: 44px;
        min-height: 44px;
        display: grid;
        place-items: center;
        font-size: 20px;
      }
      .side-note {
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }
      .side-note h3 {
        margin: 8px 0;
      }
      .side-note p {
        font-size: 13px;
        line-height: 1.75;
      }
      .side-note dl {
        margin: 20px 0;
        font-size: 12px;
      }
      .side-note dl > div {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
      }
      .side-note dd {
        margin: 0;
        color: var(--ink);
      }
      .context {
        padding: 18px 32px 0;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .context-top {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .context-top .unit {
        font-size: 20px;
        font-weight: 650;
      }
      .context-top .context-meta {
        font-size: 12px;
        color: var(--muted);
        flex: 1;
      }
      .context-top .btn {
        min-height: 40px;
      }
      .tabs {
        display: flex;
        gap: 24px;
      }
      .tabs a {
        display: flex;
        align-items: center;
        min-height: 46px;
        font-weight: 550;
        color: var(--secondary);
        border-bottom: 2px solid transparent;
      }
      .tabs a.active {
        color: var(--blue);
        border-color: var(--blue);
      }
      .work-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        height: calc(100svh - 215px);
        min-height: 480px;
      }
      .chat-main {
        padding: 22px 28px;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .work-top {
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 16px;
      }
      .work-top h2 {
        font-size: 15px;
        flex: 1;
      }
      .work-top button {
        min-height: 40px;
      }
      .thread {
        flex: 1;
        overflow-y: auto;
        padding: 24px 4px;
        max-width: 760px;
        width: 100%;
        margin: auto;
      }
      .question {
        margin-left: auto;
        max-width: 80%;
        padding: 13px 16px;
        border-radius: 8px;
        background: var(--soft);
        font-size: 13px;
        margin-bottom: 26px;
      }
      .answer-header {
        display: flex;
        gap: 14px;
        align-items: center;
        margin-bottom: 12px;
      }
      .answer-header strong {
        font-size: 14px;
      }
      .answer-body {
        font-size: 16px;
        line-height: 1.85;
        max-width: 65ch;
        color: var(--ink);
      }
      .cite {
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        background: var(--subtle);
        border: 1px solid var(--border);
        padding: 4px 10px;
        border-radius: 4px;
        margin-top: 18px;
      }
      .answer-actions {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 14px;
      }
      .answer-actions button {
        min-height: 40px;
        padding: 6px 10px;
      }
      .composer {
        padding: 12px;
        background: var(--surface);
        border: 1px solid var(--control);
        border-radius: 8px;
        margin-top: 16px;
        max-width: 760px;
        width: 100%;
        align-self: center;
      }
      .composer label {
        font-size: 12px;
        color: var(--secondary);
      }
      .composer textarea {
        border: 0;
        padding: 8px 0;
        min-height: 62px;
        width: 100%;
        resize: none;
        background: transparent;
      }
      .composer-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }
      .composer-bottom select {
        min-height: 36px;
        padding: 5px 8px;
        font-size: 12px;
      }
      .composer-note {
        font-size: 11px;
        margin-top: 8px;
        color: var(--muted);
      }
      .evidence {
        border-left: 1px solid var(--border);
        background: var(--surface);
        padding: 24px 22px;
        overflow: auto;
      }
      .evidence .section-top {
        margin-bottom: 24px;
      }
      .evidence h2 {
        font-size: 14px;
      }
      .evidence h3 {
        margin: 10px 0 4px;
      }
      .evidence blockquote {
        margin: 16px 0;
        padding: 14px 0;
        border-block: 1px solid var(--border);
        font-size: 14px;
        line-height: 1.85;
      }
      .evidence .locator {
        font-size: 12px;
        color: var(--blue);
      }
      .evidence p {
        font-size: 12px;
        line-height: 1.8;
      }
      .evidence .source {
        margin-bottom: 28px;
      }
      .mobile-only {
        display: none;
      }
      .studio-config {
        padding: 20px 28px;
        border-bottom: 1px solid var(--border);
        background: var(--canvas);
      }
      .studio-config .section-top {
        margin-bottom: 14px;
      }
      .config-row {
        display: grid;
        grid-template-columns: 1.1fr 1.1fr 0.85fr auto;
        gap: 12px;
        align-items: end;
      }
      .studio-config details {
        margin-top: 12px;
        font-size: 12px;
      }
      .studio-config summary {
        cursor: pointer;
        min-height: 40px;
        display: flex;
        align-items: center;
        color: var(--secondary);
      }
      .advanced {
        display: flex;
        gap: 16px;
        padding: 10px 0;
      }
      .studio-output {
        padding: 26px 28px;
        max-width: 900px;
        margin: auto;
      }
      .studio-output .section-top {
        margin-bottom: 22px;
      }
      .flashcard {
        border-top: 2px solid var(--blue);
        border-bottom: 1px solid var(--border);
        padding: 32px;
        text-align: center;
        background: var(--surface);
        min-height: 180px;
        display: grid;
        align-content: center;
        gap: 12px;
      }
      .flashcard p {
        font-size: 22px;
        line-height: 1.65;
        color: var(--ink);
        max-width: 30ch;
        margin: auto;
      }
      .flashcard small {
        display: block;
      }
      .flip-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 0;
      }
      .callout {
        padding: 16px 18px;
        background: var(--subtle);
        border-radius: 6px;
        font-size: 13px;
        margin-top: 16px;
      }
      .callout strong {
        color: var(--amber);
        display: block;
        margin-bottom: 4px;
      }
      .studio-shell .work-grid {
        height: calc(100svh - 393px);
        min-height: 400px;
      }
      .studio-shell .evidence {
        padding-top: 26px;
      }
      .intake-grid {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 36px;
      }
      .deadline {
        padding: 16px 0;
        border-block: 1px solid var(--border);
        margin-bottom: 24px;
      }
      .deadline strong {
        display: block;
        font-size: 14px;
        margin: 5px 0;
      }
      .checklist {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .checklist li {
        padding: 16px 0;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 10px;
      }
      .checklist .number {
        width: 24px;
        height: 24px;
        border: 1px solid var(--border);
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
      }
      .checklist strong {
        font-size: 13px;
        display: block;
      }
      .checklist small {
        display: block;
      }
      .intake-work h2 {
        margin-bottom: 6px;
      }
      .upload-zone {
        margin: 20px 0;
        border: 1px dashed var(--control);
        padding: 22px;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .upload-zone h3 {
        margin-bottom: 4px;
      }
      .upload-zone p {
        font-size: 12px;
      }
      .file-editor {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
      }
      .file-title {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: space-between;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 18px;
      }
      .file-fields {
        display: grid;
        grid-template-columns: 1fr 1.25fr;
        gap: 16px;
      }
      .rights {
        display: flex;
        gap: 10px;
        align-items: start;
        font-size: 13px;
        margin: 18px 0;
      }
      .rights input {
        min-height: 0;
        width: 17px;
        height: 17px;
        flex-shrink: 0;
        margin-top: 4px;
      }
      .file-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
      }
      .intake-status {
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }
      .status-row {
        display: flex;
        gap: 20px;
        align-items: center;
        justify-content: space-between;
        margin-top: 14px;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
      }
      .status-row p {
        font-size: 12px;
      }
      .admin-content {
        padding: 26px 28px;
      }
      .admin-heading {
        margin-bottom: 20px;
      }
      .filters {
        display: flex;
        gap: 12px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 20px;
      }
      .filters button {
        border: 0;
        background: transparent;
        min-height: 46px;
        padding: 8px 12px;
        color: var(--secondary);
        border-bottom: 2px solid transparent;
        font-size: 13px;
      }
      .filters button.active {
        color: var(--blue);
        border-color: var(--blue);
        font-weight: 650;
      }
      .admin-grid {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 28px;
      }
      .decision-queue {
        min-width: 0;
        border-right: 1px solid var(--border);
        padding-right: 20px;
      }
      .decision-queue .field {
        margin-bottom: 16px;
      }
      .queue-item {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        text-align: left;
        display: grid;
        gap: 5px;
        width: 100%;
        padding: 14px;
        min-height: 76px;
      }
      .queue-item strong {
        font-size: 13px;
      }
      .queue-item small {
        font-size: 11px;
      }
      .queue-item.active {
        background: var(--soft);
        border-color: var(--border);
      }
      .queue-item:hover {
        background: var(--subtle);
      }
      .action-sheet {
        max-width: 780px;
      }
      .action-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        gap: 12px;
      }
      .action-sheet h2 {
        font-size: 22px;
        margin: 8px 0 4px;
      }
      .action-sheet .scope {
        font-size: 13px;
        margin-bottom: 24px;
      }
      .state-diff {
        display: grid;
        grid-template-columns: 1fr 36px 1fr;
        gap: 14px;
        align-items: center;
        padding: 20px 0;
        border-block: 1px solid var(--border);
        margin-bottom: 24px;
      }
      .state-diff strong {
        display: block;
        font-size: 20px;
        margin-top: 4px;
      }
      .state-diff span.arrow {
        text-align: center;
        color: var(--muted);
      }
      .action-sheet .field {
        margin: 20px 0;
      }

  <body>
    <div class="review">
      <strong>Design proposal</strong
      ><span class="descriptor">Synthetic • no connected services</span
      ><select id="screen" aria-label="Concept screen">
        <option value="shelf">01 — Study Shelf</option>
        <option value="chat">02 — Chat & evidence</option>
        <option value="studio">03 — Study Studio</option>
        <option value="intake">04 — Campaign intake</option>
        <option value="admin">05 — Admin decisions</option></select
      ><span class="grow"></span><a href="../audit.md">Read the audit</a
      ><button id="theme" aria-label="Toggle concept theme">Dark</button>
    </div>
    <div id="root"></div>
    <div
      class="sheet"
      id="dialog"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="dialog-title"
    >
      <div class="sheet-inner" id="dialog-body"></div>
    </div>
    <script>
      const $ = (s) => document.querySelector(s);
      const params = new URLSearchParams(location.search);
      let screen = params.get("screen") || "shelf";
      let selected = false;
      let flipped = false;
      let blocked = false;
      const brand =
        '<img class="logo-light" src="assets/folio-light.svg" alt=""><img class="logo-dark" src="assets/folio-dark.svg" alt=""><span>UniMind</span>';
      const roleName = () =>
        screen === "intake"
          ? "Batch Leader"
          : screen === "admin"
            ? "Admin"
            : "Student";
      function link(label, mark, target, active) {
        return (
          '<a href="?screen=' +
          target +
          '" class="' +
          (active ? "active" : "") +
          '"><span class="nav-mark" aria-hidden="true">' +
          mark +
          '</span><span class="label">' +
          label +
          "</span></a>"
        );
      }
      function shell(body, context = "") {
        const role = roleName();
        const nav =
          role === "Admin"
            ? link("Decisions", "≡", "admin", true) +
              link("Content", "▤", "admin", false) +
              link("Academics", "◇", "admin", false) +
              link("Access context", "◎", "admin", false) +
              link("Operations", "↗", "admin", false)
            : role === "Batch Leader"
              ? link("Uploads", "↑", "intake", true) +
                link("Latest submissions", "≡", "intake", false) +
                link("Account", "◉", "intake", false)
              : link("Study", "◫", "shelf", screen === "shelf") +
                link("Subjects", "▤", "shelf", false) +
                link("Account", "◉", "shelf", false);
        return (
          '<div class="app"><aside class="rail"><a class="brand" href="?screen=shelf">' +
          brand +
          '</a><div><div class="rail-label">' +
          role +
          ' workspace</div><nav aria-label="Global navigation">' +
          nav +
          '</nav></div><div class="rail-note"><strong>Study deeper<br>Go further.</strong><p>One subject.<br>One authorized source pool.</p></div></aside><main class="main"><header class="utility"><span class="crumb">UniMind <span aria-hidden="true">/</span> ' +
          (role === "Admin"
            ? "Governance"
            : role === "Batch Leader"
              ? "Material collection"
              : "Faculty of Medicine · Year 1 · Term 1") +
          '</span><button class="lang" data-demo="Language switching needs the approved bilingual implementation.">English</button><span class="role"><span class="avatar">' +
          (role === "Admin" ? "AD" : role === "Batch Leader" ? "BL" : "ST") +
          "</span>" +
          role +
          "</span></header>" +
          context +
          body +
          '</main></div><nav class="bottom-nav" aria-label="Mobile navigation"><a class="active" href="?screen=' +
          (role === "Admin"
            ? "admin"
            : role === "Batch Leader"
              ? "intake"
              : "shelf") +
          '"><span aria-hidden="true">◫</span>' +
          (role === "Admin"
            ? "Decisions"
            : role === "Batch Leader"
              ? "Uploads"
              : "Study") +
          '</a><a href="?screen=' +
          screen +
          '"><span aria-hidden="true">≡</span>' +
          (role === "Admin"
            ? "Sections"
            : role === "Batch Leader"
              ? "Latest"
              : "Subjects") +
          '</a><a href="?screen=' +
          screen +
          '" data-demo="Account proposal: role identity, Appearance, applicable privacy settings and account actions."><span aria-hidden="true">◉</span>Account</a></nav>'
        );
      }
      function unitContext(active) {
        return (
          '<div class="context"><div class="context-top"><a href="?screen=shelf" class="quiet-link">← Subjects</a><strong class="unit">Anatomy</strong><span class="context-meta">8 materials · edition 2026–2027</span><button class="btn quiet" data-demo="The unit picker retains authorized choices and preserves their academic context.">Switch unit ⌄</button></div><nav class="tabs" aria-label="Subject tools">' +
          ["Materials", "Chat", "Studio", "Quiz"]
            .map(
              (n) =>
                "<a " +
                (n === "Materials" || n === "Quiz"
                  ? 'data-demo="' +
                    n +
                    ' retains the existing route and workflow in implementation."'
                  : "") +
                ' class="' +
                (n.toLowerCase() === active ? "active" : "") +
                '" href="?screen=' +
                (n === "Chat" ? "chat" : n === "Studio" ? "studio" : screen) +
                '">' +
                n +
                "</a>",
            )
            .join("") +
          "</nav></div>"
        );
      }
      const evidence = () =>
        '<aside class="evidence"><div class="section-top"><h2>Source evidence</h2><small>Approved pool</small></div><div class="source"><span class="eyebrow">Supporting material</span><h3>Synthetic sequence handout</h3><a class="locator" href="#" data-demo="Open the exact source locator in the existing evidence route.">PDF · sample page 3 ↗</a><blockquote>Identify the labels, then compare the diagrams.</blockquote><span class="badge">Supports the sequence</span></div><div class="source"><span class="eyebrow">Limits to keep visible</span><h3>Timing is unspecified</h3><p>The source provides no duration. Do not infer one from the sequence.</p></div><p>Illustrative excerpts only. The proposal preserves source, exchange and scope binding.</p></aside>';
      function shelf() {
        return shell(
          '<div class="content"><div class="heading"><div><h1>Your Study Shelf</h1><p>Faculty of Medicine · First year · Term 1</p></div><a class="quiet-link" href="#" data-demo="Edit academic settings without changing the current authorized catalog rules.">Academic settings ↗</a></div><div class="shelf-grid"><section><div class="resume"><div><span class="eyebrow">Resume this session</span><h2>Anatomy</h2><p>Return to your study conversation</p></div><a class="btn primary" href="?screen=chat">Continue →</a></div><div class="section-top"><h2>Modules <small>5</small></h2><label class="field search"><span>Search subjects</span><input id="subject-search" placeholder="Find a module…" type="search"></label></div><div class="subject-list" id="subject-list">' +
            [
              "Anatomy",
              "Biochemistry",
              "Physiology",
              "Pathology",
              "Pharmacology",
            ]
              .map(
                (n, i) =>
                  '<article class="subject" data-subject="' +
                  n.toLowerCase() +
                  '"><span class="num">0' +
                  (i + 1) +
                  '</span><div class="copy"><a class="title" href="?screen=chat">' +
                  n +
                  '</a><p>8 sample materials · 2026–2027 edition</p></div><span class="badge">Ready</span><a class="arrow" href="?screen=chat" aria-label="Open ' +
                  n +
                  ' concept">→</a></article>',
              )
              .join("") +
            '</div><p id="no-results" class="notice" hidden>No matching modules. Clear or change your search.</p></section><aside><div class="side-note"><span class="eyebrow">Your academic context</span><h3>Faculty of Medicine</h3><p>Your available modules follow your cohort’s released curriculum.</p><dl><div><dt>Level</dt><dd>First year</dd></div><div><dt>Period</dt><dd>Term 1</dd></div><div><dt>Edition</dt><dd>2026–2027</dd></div></dl><p>Availability is derived from approved sources and release rules.</p></div></aside></div></div>',
        );
      }
      function chat() {
        return shell(
          '<div class="work-grid"><section class="chat-main"><div class="work-top"><h2>Study sequence</h2><button class="btn quiet" data-demo="Session history opens as a bounded panel; its existing per-unit session model remains unchanged.">Sessions ⌄</button><button class="btn" id="new-chat">New session</button><button class="btn mobile-only" id="show-evidence">Sources</button></div><div class="thread" id="thread"><div class="question">Explain the sample unit’s study sequence.</div><div class="answer-header"><strong>UniMind</strong><span class="badge">Supported</span></div><p class="answer-body">The synthetic handout says to identify the labelled structures, then compare the two diagrams.</p><p class="answer-body" style="margin-top:14px">This fixed example uses only the sample handout.</p><button class="cite" id="cite">1 · Sequence handout · p. 3 ↗</button><div class="answer-actions"><button class="btn quiet" data-demo="The existing exchange-specific report form opens with the applicable privacy disclosure.">Report answer</button><small>Shared · this exchange</small></div></div><form class="composer" id="chat-form"><label for="question">Message</label><textarea id="question" placeholder="Ask about Anatomy…" rows="2"></textarea><div class="composer-bottom"><label class="field"><span class="sr">Study language</span><select aria-label="Study language"><option>English</option><option>Arabic</option><option>Mixed</option></select></label><button type="submit" class="btn primary">Send ↑</button></div><p class="composer-note">Founder-visible by default · Enter to send; Shift+Enter for a new line</p></form></section>' +
            evidence() +
            "</div>",
          unitContext("chat"),
        );
      }
      function studio() {
        return shell(
          '<section class="studio-shell"><div class="studio-config"><div class="section-top"><div><h2>Make a study aid</h2><p class="meta">One approved source pool · keep evidence attached</p></div></div><div class="config-row"><label class="field">Study aid<select id="artifact"><option>Flashcards</option><option>Structured summary</option><option>Study guide</option><option>Practice questions</option><option>Revision pack</option><option>MCQ quiz</option></select></label><label class="field">Topic<select><option>Study sequence</option><option>Diagram comparison</option></select></label><label class="field">Output language<select><option>English</option><option>Arabic</option><option>Mixed</option></select></label><button class="btn primary" id="generate">Generate</button></div><details><summary>More options · Concise · Short ⌄</summary><div class="advanced"><label class="field">Depth<select><option>Concise</option><option>Detailed</option></select></label><label class="field">Size<select><option>Short</option><option>Extended</option></select></label></div></details></div><div class="work-grid"><section class="studio-output"><div class="section-top"><div><span class="eyebrow">Illustrative output concept</span><h2>Study sequence · Flashcards</h2></div><button class="btn mobile-only" id="show-evidence">Sources</button><span class="badge">Source attached</span></div><div class="flashcard" id="flashcard"><small id="card-side">Question</small><p id="card-copy">What sequence does the sample handout use?</p></div><div class="flip-row"><small>Sample card · 1 of 1</small><button class="btn" id="flip">Reveal answer</button></div><div class="callout"><strong>Evidence limits</strong><p>Timing is missing. The recording reverses the sequence. This study aid does not resolve that disagreement.</p></div><p class="meta" id="studio-status" role="status" style="margin-top:16px">Choose options above to preview another fixed example.</p></section>' +
            evidence() +

      function intake() {
        return shell(
          '<div class="content"><a href="#" class="quiet-link" data-demo="Return to currently assigned campaigns.">← Assigned campaigns</a><div class="heading"><div><h1>Anatomy source call</h1><p>Human Medicine · Year 1 · Term 1 · synthetic campaign</p></div><span class="badge">Assigned</span></div><div class="intake-grid"><aside><div class="deadline"><span class="eyebrow">Your upload access ends</span><strong>10 Oct · 11:00 PM</strong><p class="meta">Campaign closes 12 Oct. Your assignment expires earlier.</p></div><div class="section-top"><h3>Requested materials</h3><small>3 required</small></div><ol class="checklist"><li><span class="number">1</span><div><strong>Sequence handout</strong><small>Awaiting file · PDF</small></div></li><li><span class="number">2</span><div><strong>Comparison recording</strong><small>Awaiting file · WAV</small></div></li><li><span class="number">3</span><div><strong>Diagram image</strong><small>Awaiting file · PNG</small></div></li></ol><p class="meta" style="margin-top:16px">Received files enter processing separately. Upload receipt does not mean a source is ready for study.</p></aside><section class="intake-work"><h2>Add requested material</h2><p class="meta">Synthetic files only · PDF, WAV or PNG · up to 10 MB each</p><div class="upload-zone"><div><h3>Choose files or drop them here</h3><p>Assign each file to a request before uploading.</p></div><button class="btn" id="choose-file">Choose files</button></div><div class="file-editor"><div class="file-title"><div><h3>synthetic-handout.pdf</h3><p class="meta">Approved reference · illustrative queue</p></div><span class="badge warn">Ready for details</span></div><div class="file-fields"><label class="field">Requested material<select><option>Sequence handout</option><option>Comparison recording</option><option>Diagram image</option></select></label><label class="field">Source title<input value="Synthetic sequence handout"></label></div><label class="field" style="margin-top:16px">Description<textarea rows="2">Handout used by this sample campaign.</textarea></label><label class="rights"><input type="checkbox" id="rights"><span>I have the rights or permission needed to submit this material.</span></label><div class="file-actions"><small>Upload first.<br>Processing follows receipt.</small><button class="btn primary" id="upload" disabled>Upload file ↑</button></div><p class="notice" id="upload-status" role="status" hidden>Illustrative receipt. No file was uploaded or stored.</p></div><div class="intake-status"><div class="section-top"><h3>Latest submissions</h3><a class="quiet-link" href="#" data-demo="Latest-per-request view; an actual historical archive needs a separately approved data contract.">View latest →</a></div><div class="status-row"><div><h3>Tracking example 2</h3><p>Synthetic historical source</p></div><span class="badge warn">Needs information</span><button class="btn quiet" data-demo="Production implementation must show the supplied review reason and the existing allowed correction action; none is invented here.">Review reason →</button></div></div></section></div></div>',
        );
      }
      const queueData = [
        ["Hide unit", "Anatomy · Published → Withdrawn"],
        ["Deactivate source version", "Sequence handout · Active → Inactive"],
        ["Lock cohort", "Medicine · Year 1 · Unlocked → Locked"],
        [
          "Disable provider or artifact",
          "Approved artifact · Enabled → Disabled",
        ],
      ];
      function admin() {
        return shell(
          '<div class="admin-content"><div class="heading admin-heading"><div><h1>Governed decisions</h1><p>Review readiness, scope and consequences before recording a change.</p></div><span class="meta">Admin · synthetic review</span></div><div class="filters" aria-label="Queue status"><button class="active" data-filter="available">Available</button><button data-filter="blocked">Blocked</button><button data-filter="pending">Pending confirmation</button></div><div class="admin-grid"><aside class="decision-queue"><label class="field">Find a decision<input id="decision-search" type="search" placeholder="Action or target…"></label><div class="queue-items" id="queue-items">' +
            queueData
              .map(
                (q, i) =>
                  '<button class="queue-item" data-action="' +
                  i +
                  '"><strong>' +
                  q[0] +
                  "</strong><small>" +
                  q[1] +
                  '</small><span class="badge">Decision available</span></button>',
              )
              .join("") +
            '</div><p class="meta">Illustrative subset of existing candidates. Counts are intentionally omitted.</p></aside><section class="action-sheet" id="action-sheet"><div class="empty-selection"><div><span class="eyebrow">Choose deliberately</span><h2>Select a decision to inspect</h2><p>Available changes are separated from blocked changes. Nothing is selected or submitted automatically.</p></div></div></section></div></div>',
        );
      }
      function actionView(i) {
        selected = true;
        const q = queueData[i];
        const names = [
          ["Published", "Withdrawn"],
          ["Active", "Inactive"],
          ["Unlocked", "Locked"],
          ["Enabled", "Disabled"],
        ][i];
        const consequence = [
          "This unit is hidden from student availability immediately; its history remains.",
          "This source leaves student availability immediately; processed history remains.",
          "This cohort becomes unavailable to students immediately; its history remains.",
          "This provider or artifact is disabled immediately; existing records remain.",
        ][i];
        $("#action-sheet").innerHTML =
          '<button class="btn mobile-only" id="back-to-decisions">← Available decisions</button><div class="action-head"><span class="eyebrow">Exact scope review</span><span class="badge">Decision available</span></div><h2>' +
          q[0] +
          '</h2><p class="scope">' +
          q[1].split(" · ")[0] +
          ' · current edition · synthetic target</p><div class="state-diff"><div><span class="meta">Current state</span><strong>' +
          names[0] +
          '</strong></div><span class="arrow">→</span><div><span class="meta">Proposed state</span><strong>' +
          names[1] +
          '</strong></div></div><div class="consequence"><h3>Consequence to review</h3><p>' +
          consequence +
          '</p></div><label class="field">Reason for this change<textarea id="reason" rows="3" placeholder="Explain the decision for the audit record…"></textarea></label><details><summary class="quiet-link">Target and version ⌄</summary><p class="meta">Synthetic target: ' +
          q[1].split(" · ")[0] +
          '. A current version is not supplied in this disconnected concept.</p></details><div class="action-footer"><small>No change has been recorded.</small><button class="btn" id="review-action" disabled>Review exact change →</button></div>';
        document
          .querySelectorAll("[data-action]")
          .forEach((x) =>
            x.classList.toggle("active", Number(x.dataset.action) === i),
          );
        $("#back-to-decisions").onclick = render;
        if (window.innerWidth <= 600) {
          $(".decision-queue").hidden = true;
          $("#back-to-decisions").focus();
          window.scrollTo({ top: 0, behavior: "instant" });
        }
        $("#reason").addEventListener(
          "input",
          () => ($("#review-action").disabled = !$("#reason").value.trim()),
        );
        $("#review-action").onclick = () => {
          showDialog(
            '<span class="eyebrow">Final review · proposal only</span><h2 id="dialog-title">' +
              q[0] +
              '</h2><div class="state-diff"><div><span class="meta">Current</span><strong>' +
              names[0] +
              '</strong></div><span class="arrow">→</span><div><span class="meta">Proposed</span><strong>' +
              names[1] +
              "</strong></div></div><p><strong>Target:</strong> " +
              q[1].split(" · ")[0] +
              '</p><p id="review-reason" style="margin-top:16px"></p><p style="margin-top:16px">' +
              consequence +
              '</p><p class="meta" style="margin-top:16px">Version verification is unavailable in this disconnected concept. Recording remains disabled.</p><div class="action-footer"><button class="btn" id="cancel-dialog">Cancel and edit</button><button class="btn danger" disabled>Record ' +
              q[0].toLowerCase() +
              "</button></div>",
          );
          $("#review-reason").textContent =
            "Reason: " + $("#reason").value.trim();
        };
      }
      let lastFocus = null;
      function showDialog(html) {
        lastFocus = document.activeElement;
        $("#dialog-body").innerHTML = html;
        $("#dialog").hidden = false;
        $("#cancel-dialog")?.addEventListener("click", closeDialog);
        requestAnimationFrame(() =>
          ($("#cancel-dialog") || $("#dialog-body button"))?.focus(),
        );
      }
      function closeDialog() {
        $("#dialog").hidden = true;
        lastFocus?.focus();
      }
      document.addEventListener("keydown", (e) => {
        if (!$("#dialog").hidden) {
          if (e.key === "Escape") closeDialog();
          if (e.key === "Tab") {
            const f = [
              ...$("#dialog").querySelectorAll(
                "button:not([disabled]),a,input,select,textarea",
              ),
            ];
            if (f.length) {
              if (e.shiftKey && document.activeElement === f[0]) {
                e.preventDefault();
                f.at(-1).focus();
              } else if (!e.shiftKey && document.activeElement === f.at(-1)) {
                e.preventDefault();
                f[0].focus();
              }
            }
          }
        }
      });
      function sourcesDialog() {
        showDialog(
          '<h2 id="dialog-title">Source evidence</h2><h3>Synthetic sequence handout · p. 3</h3><p style="margin-top:16px">Identify the labels, then compare the diagrams.</p><p class="meta">Illustrative source locator. The implementation retains exact exchange binding and the full-page evidence fallback.</p><button class="btn" id="cancel-dialog">Return to study</button>',
        );
      }
      function bind() {
        document.querySelectorAll("[data-demo]").forEach(
          (x) =>
            (x.onclick = (e) => {
              e.preventDefault();
              showDialog(
                '<h2 id="dialog-title">Interaction proposal</h2><p>' +
                  x.dataset.demo +
                  '</p><button class="btn" id="cancel-dialog">Close</button>',
              );
            }),
        );
        $("#subject-search")?.addEventListener("input", (e) => {
          let count = 0;
          document.querySelectorAll("[data-subject]").forEach((x) => {
            x.hidden = !x.dataset.subject.includes(
              e.target.value.toLowerCase(),
            );
            if (!x.hidden) count++;
          });
          $("#no-results").hidden = count > 0;
        });
        $("#show-evidence")?.addEventListener("click", sourcesDialog);
        $("#cite")?.addEventListener("click", sourcesDialog);
        $("#new-chat")?.addEventListener("click", () => {
          $("#thread").innerHTML =
            '<h2>Ask about Anatomy</h2><p style="margin-top:12px">Start with a question about the approved materials. Evidence stays attached to each answer.</p>';
          $("#question").focus();
        });
        $("#chat-form")?.addEventListener("submit", (e) => {
          e.preventDefault();
          if (!$("#question").value.trim()) return;
          $("#thread").innerHTML =
            '<div class="question"></div><div class="answer-header"><strong>UniMind</strong><span class="badge">Illustrative reply</span></div><p class="answer-body">Identify the labelled structures, then compare the two diagrams. This is the same fixed sample passage.</p><p class="meta" style="margin-top:14px">No model or backend was called.</p>';
          $("#thread .question").textContent = $("#question").value;
          $("#question").value = "";
          $("#question").focus();
        });
        $("#question")?.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            $("#chat-form").requestSubmit();
          }
        });
        $("#flip")?.addEventListener("click", () => {
          flipped = !flipped;
          $("#card-side").textContent = flipped ? "Answer" : "Question";
          $("#card-copy").textContent = flipped
            ? "Identify labels, then compare diagrams."
            : "What sequence does the sample handout use?";
          $("#flip").textContent = flipped ? "Show question" : "Reveal answer";
        });
        $("#generate")?.addEventListener("click", () => {
          $("#studio-status").textContent =
            "Fixed " +
            $("#artifact").value.toLowerCase() +
            " preview selected. No artifact was persisted.";
        });
        $("#rights")?.addEventListener(
          "change",
          (e) => ($("#upload").disabled = !e.target.checked),
        );
        $("#upload")?.addEventListener("click", () => {
          $("#upload-status").hidden = false;
          $("#upload").disabled = true;
          $("#upload").textContent = "Receipt preview";
        });
        $("#choose-file")?.addEventListener("click", () =>
          showDialog(
            '<h2 id="dialog-title">Illustrative intake</h2><p>The approved-reference file is already queued in this concept. No device file picker, storage or upload service is connected.</p><button class="btn" id="cancel-dialog">Return to intake</button>',
          ),
        );
        document
          .querySelectorAll("[data-action]")
          .forEach(
            (x) => (x.onclick = () => actionView(Number(x.dataset.action))),
          );
        document.querySelectorAll("[data-filter]").forEach(
          (x) =>
            (x.onclick = () => {
              document
                .querySelectorAll("[data-filter]")
                .forEach((y) => y.classList.toggle("active", y === x));
              $("#action-sheet").innerHTML =
                '<div class="empty-selection"><div><h2>' +
                (x.dataset.filter === "blocked"
                  ? "Blocked changes"
                  : x.dataset.filter === "pending"
                    ? "Pending confirmation"
                    : "Select a decision to inspect") +
                "</h2><p>" +
                (x.dataset.filter === "blocked"
                  ? "A blocked change should show the failed readiness predicate and allowed next step."
                  : x.dataset.filter === "pending"
                    ? "Second confirmations require a different eligible actor; the concept does not simulate authorization."
                    : "Nothing is selected or submitted automatically.") +
                "</p></div></div>";
              $("#queue-items").hidden = x.dataset.filter !== "available";
            }),
        );
        $("#decision-search")?.addEventListener("input", (e) =>
          document
            .querySelectorAll("[data-action]")
            .forEach(
              (x) =>
                (x.hidden = !x.textContent
                  .toLowerCase()
                  .includes(e.target.value.toLowerCase())),
            ),
        );
      }
      function render() {
        screen = ["shelf", "chat", "studio", "intake", "admin"].includes(screen)
          ? screen
          : "shelf";
        $("#screen").value = screen;
        $("#root").innerHTML = { shelf, chat, studio, intake, admin }[screen]();
        bind();
        window.scrollTo({ top: 0, behavior: "instant" });
      }
      $("#screen").onchange = (e) => {
        screen = e.target.value;
        history.replaceState(null, "", "?screen=" + screen);
        render();
      };
      $("#theme").onclick = () => {
        const dark = document.documentElement.dataset.theme !== "dark";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        $("#theme").textContent = dark ? "Light" : "Dark";
      };
      render();
    </script>
  </body>
</html>
