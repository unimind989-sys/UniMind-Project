<!doctype html>
<html lang="en" dir="ltr" data-theme="light" data-motion="full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UniMind · Open Folio refinement review</title>
    <style>
      @font-face {
        font-family: Manrope;
        src: url("../concepts/assets/manrope.woff2") format("woff2");
        font-weight: 200 800;
        font-display: swap;
      }
      @font-face {
        font-family: NotoArabic;
        src: url("assets/noto-sans-arabic.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
        unicode-range:
          U+600-6FF, U+750-77F, U+870-8FF, U+FB50-FDFF, U+FE70-FEFC;
      }
      :root {
        --canvas: #f6f7f8;
        --paper: #fff;
        --subtle: #eef0f2;
        --hover: #e6e9ed;
        --ink: #202124;
        --secondary: #535861;
        --muted: #626873;
        --line: #d9dde3;
        --control: #777f8b;
        --blue: #2458b8;
        --blue-hover: #194794;
        --blue-soft: #e8effb;
        --blue-ink: #214f9f;
        --on-blue: #fff;
        --good: #236746;
        --good-soft: #edf6f0;
        --bad: #a32723;
        --bad-soft: #fceeed;
        --spine: #1d2939;
        --spine-ink: #eef2f8;
        --spine-muted: #bdc8d6;
        --spine-hover: #2b3b51;
        --annotation: #f1f4fa;
        --shadow: 0 12px 40px #101c2b26;
        --fast: 120ms;
        --state: 180ms;
        --signature: 300ms;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --toolbar: 64px;
        --radius: 8px;
      }
      [data-theme="dark"] {
        --canvas: #1b1c1f;
        --paper: #23272f;
        --subtle: #2c313a;
        --hover: #353d48;
        --ink: #eef0f3;
        --secondary: #bdc2cb;
        --muted: #a6acb7;
        --line: #434b57;
        --control: #858d9a;
        --blue: #adc7ff;
        --blue-hover: #c6d7ff;
        --blue-soft: #2b3c59;
        --blue-ink: #b9d0ff;
        --on-blue: #152646;
        --good: #91d2ad;
        --good-soft: #253a31;
        --bad: #ffb4ab;
        --bad-soft: #432b2e;
        --spine: #141b25;
        --spine-hover: #253246;
        --annotation: #202c40;
        --shadow: 0 12px 40px #0008;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Manrope, Arial, sans-serif;
        color: var(--ink);
        background: var(--canvas);
        font-size: 15px;
        line-height: 1.55;
      }
      html[lang="ar"] body {
        font-family: NotoArabic, Manrope, Arial, sans-serif;
        line-height: 1.75;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        touch-action: manipulation;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      button,
      input,
      select,
      textarea,
      a {
        outline-offset: 3px;
      }
      :focus-visible {
        outline: 3px solid var(--blue);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 34px;
        letter-spacing: -0.035em;
        line-height: 1.18;
        font-weight: 700;
      }
      h2 {
        font-size: 22px;
        letter-spacing: -0.022em;
        line-height: 1.35;
        font-weight: 700;
      }
      h3 {
        font-size: 16px;
        line-height: 1.5;
        font-weight: 700;
      }
      html[lang="ar"] :is(h1, h2, h3) {
        letter-spacing: normal;
        line-height: 1.55;
      }
      small,
      .meta {
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
      }
      .muted {
        color: var(--secondary);
      }
      .icon {
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        stroke: currentColor;
        stroke-width: 1.75;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .directional {
        transform: scaleX(1);
      }
      [dir="rtl"] .directional {
        transform: scaleX(-1);
      }
      .inline {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .spread {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .gap8 {
        gap: 8px;
      }
      .gap24 {
        gap: 24px;
      }
      .btn {
        min-height: 44px;
        border: 1px solid var(--control);
        background: var(--paper);
        color: var(--ink);
        padding: 9px 15px;
        border-radius: var(--radius);
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        font-weight: 650;
        font-size: 14px;
        transition:
          background var(--fast),
          border-color var(--fast),
          transform var(--fast) var(--ease);
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn:active:not(:disabled) {
        transform: translateY(1px);
      }
      .btn.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: var(--on-blue);
      }
      .btn.primary:hover {
        background: var(--blue-hover);
      }
      .btn.quiet {
        background: transparent;
        border-color: transparent;
        color: var(--blue);
      }
      .btn.quiet:hover {
        background: var(--blue-soft);
      }
      .btn.danger {
        color: var(--bad);
        border-color: var(--bad);
      }
      .icon-btn {
        width: 44px;
        padding: 10px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 650;
        white-space: nowrap;
        color: var(--secondary);
      }
      .tag.ready {
        color: var(--good);
      }
      .tag.ready::before {
        content: "";
        width: 6px;
        height: 6px;
        background: currentColor;
        border-radius: 50%;
      }
      .pill {
        padding: 3px 9px;
        border-radius: 4px;
        background: var(--subtle);
        font-size: 13px;
        color: var(--secondary);
      }
      label.field {
        display: grid;
        gap: 7px;
        font-size: 14px;
        font-weight: 650;
      }
      input,
      select,
      textarea {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--control);
        border-radius: var(--radius);
        padding: 10px 12px;
        background: var(--paper);
        color: var(--ink);
        font-size: 15px;
      }
      textarea {
        resize: vertical;
        line-height: 1.5;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--muted);
      }
      input[aria-invalid="true"],
      textarea[aria-invalid="true"] {
        border-color: var(--bad);
      }
      .help {
        font-size: 13px;
        font-weight: 400;
        line-height: 1.55;
        color: var(--muted);
      }
      .check {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 14px;
      }
      .check input {
        width: 20px;
        min-height: 20px;
        margin: 3px 0 0;
        accent-color: var(--blue);
      }
      .notice {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--subtle);
        font-size: 14px;
      }
      .notice.success {
        background: var(--good-soft);
        color: var(--good);
        border-color: var(--good);
      }
      .notice.error {
        background: var(--bad-soft);
        color: var(--bad);
        border-color: var(--bad);
      }
      .notice .icon {
        margin-top: 1px;
      }
      .notice p + p {
        margin-top: 6px;
      }
      .skip {
        position: fixed;
        inset-block-start: 8px;
        inset-inline-start: 8px;
        transform: translateY(-140%);
        z-index: 30;
        background: var(--paper);
        padding: 8px;
      }
      .skip:focus {
        transform: none;
      }
      .reviewbar {
        height: var(--toolbar);
        position: relative;
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding: 8px 20px;
        background: var(--paper);
        font-size: 13px;
      }
      .reviewtitle {
        flex: 1;
        line-height: 1.4;
        min-width: 120px;
      }
      .reviewtitle strong {
        font-size: 14px;
      }
      .reviewcontrols {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .reviewcontrols select {
        min-height: 36px;
        padding: 6px 28px 6px 9px;
        font-size: 13px;
        width: auto;
        max-width: 180px;
        border-radius: 5px;
      }
      .reviewcontrols label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .shell {
        display: grid;
        grid-template-columns: 192px minmax(0, 1fr);
        height: calc(100dvh - var(--toolbar));
      }
      .spine {
        background: var(--spine);
        color: var(--spine-ink);
        padding: 26px 18px 18px;
        display: flex;
        flex-direction: column;
        gap: 34px;
        overflow: auto;
      }
      .brand img {
        width: 145px;
        height: 36px;
        object-fit: contain;
        object-position: left center;
      }
      .spine nav {
        display: grid;
        gap: 6px;
      }
      .navlink {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 46px;
        padding: 10px;
        border: 0;
        background: none;
        border-radius: 7px;
        color: var(--spine-muted);
        font-size: 14px;
        font-weight: 600;
        text-align: start;
        position: relative;
      }
      .navlink:hover {
        color: var(--spine-ink);
        background: var(--spine-hover);
      }
      .navlink.active {
        color: white;
        background: var(--spine-hover);
      }
      .navlink.active::after {
        content: "";
        position: absolute;
        inset-inline-end: -18px;
        inset-block-start: 16px;
        width: 8px;
        height: 14px;
        background: var(--canvas);
        clip-path: polygon(100% 0, 0 50%, 100% 100%);
      }
      [dir="rtl"] .navlink.active::after {
        clip-path: polygon(0 0, 100% 50%, 0 100%);
      }
      .spine :focus-visible {
        outline-color: #adc7ff;
      }
      .identity {
        margin-top: auto;
        display: grid;
        gap: 12px;
        padding-top: 16px;
        border-top: 1px solid #546176;
      }
      .identity .meta {
        color: var(--spine-muted);
      }
      .avatar {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        background: #344359;
        border: 1px solid #78879b;
        border-radius: 50%;
        font-size: 13px;
      }
      .spine .wordmark {
        font-size: 12px;
        line-height: 1.8;
        color: var(--spine-muted);
      }
      .main {
        min-width: 0;
        overflow: auto;
        scrollbar-gutter: stable;
        padding: 32px 40px 40px;
      }
      .page {
        max-width: 1140px;
        margin: auto;
      }
      .page-heading {
        margin-bottom: 30px;
      }
      .page-heading .muted {
        margin-top: 10px;
        max-width: 62ch;
      }
      .mobilebar,
      .bottomnav {
        display: none;
      }
      .section-line {
        padding-block: 18px;
        border-block-start: 1px solid var(--line);
      }
      .paper {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        position: relative;
      }
      .paper-head {
        padding: 18px 24px;
        border-bottom: 1px solid var(--line);
      }
      .paper-body {
        padding: 24px;
      }
      .collection {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 270px;
        gap: 40px;
      }
      .collection-main .spread {
        margin-bottom: 18px;
      }
      .search {
        position: relative;
        max-width: 255px;
      }
      .search input {
        padding-inline-start: 39px;
      }
      .search .icon {
        position: absolute;
        inset-inline-start: 12px;
        top: 11px;
        width: 19px;
        height: 19px;
      }
      .subject-index {
        border-top: 1px solid var(--line);
      }
      .subject-row {
        display: flex;
        align-items: center;
        gap: 20px;
        width: 100%;
        min-height: 99px;
        padding: 18px 4px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: none;
        text-align: start;
        color: var(--ink);
        transition: background var(--fast);
      }
      .subject-row:hover {
        background: var(--subtle);
      }
      .subject-row .subject-copy {
        flex: 1;
        min-width: 0;
      }
      .subject-row h3 {
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      .subject-row .meta {
        margin-top: 3px;
      }
      .subject-row .directional {
        color: var(--blue);
        transition: translate var(--state) var(--ease);
      }
      .subject-row:hover .directional {
        translate: 3px 0;
      }
      [dir="rtl"] .subject-row:hover .directional {
        translate: -3px 0;
      }
      .folio-mark {
        height: 48px;
        width: 38px;
        flex: 0 0 38px;
        border: 1px solid var(--control);
        border-radius: 2px 5px 5px 2px;
        position: relative;
        background: var(--paper);
      }
      .folio-mark::before {
        content: "";
        position: absolute;
        inset-inline-start: 7px;
        inset-block: 0;
        border-inline-start: 1px solid var(--line);
      }
      .folio-mark::after {
        content: "";
        position: absolute;
        inset-block-start: 0;
        inset-inline-end: 7px;
        width: 7px;
        height: 19px;
        background: var(--blue);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%);
      }
      .orientation {
        padding-top: 64px;
      }
      .orientation h2 {
        font-size: 20px;
        margin-bottom: 14px;
      }
      .orientation .folio-emblem {
        width: 148px;
        height: 116px;
        margin-bottom: 18px;
        color: var(--blue);
      }
      .orientation p {
        color: var(--secondary);
        font-size: 14px;
        line-height: 1.75;
        margin-top: 12px;
      }
      .context-note {
        margin-top: 22px;
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }
      .context-note strong {
        display: block;
        font-size: 14px;
        margin-bottom: 5px;
      }
      .unithead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }
      .unithead h1 {
        font-size: 26px;
        letter-spacing: -0.02em;
      }
      .unithead .meta {
        margin-top: 4px;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        font-size: 13px;
        color: var(--secondary);
      }
      .breadcrumb button {
        font-size: 13px;
        min-height: 32px;
        padding: 0 4px;
      }
      .tabs {
        display: flex;
        gap: 26px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 24px;
        min-height: 45px;
      }
      .tabs button {
        border: 0;
        background: none;
        color: var(--secondary);
        padding: 8px 0 14px;
        font-size: 14px;
        font-weight: 600;
        position: relative;
        white-space: nowrap;
      }
      .tabs button[aria-current="page"] {
        color: var(--blue);
        font-weight: 750;
      }
      .tabs button[aria-current="page"]::after {
        content: "";
        position: absolute;
        inset-inline: 0;
        bottom: -1px;
        height: 2px;
        background: var(--blue);
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 276px;
        gap: 24px;
        align-items: start;
      }
      .chat-work {
        height: calc(100dvh - var(--toolbar) - 215px);
        min-height: 365px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .thread-head {
        padding: 16px 22px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .thread-head h2 {
        font-size: 18px;
      }
      .thread {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 26px 30px;
      }
      .reading-empty {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        max-width: 60ch;
      }
      .reading-empty .icon {
        width: 36px;
        height: 36px;
        color: var(--blue);
        margin-bottom: 16px;
      }
      .reading-empty h2 {
        font-size: 26px;
        margin-bottom: 12px;
      }
      .reading-empty p {
        color: var(--secondary);
        max-width: 47ch;
        line-height: 1.75;
      }
      .suggestion {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: start;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: none;
        color: var(--blue);
        padding: 12px 0;
        font-size: 14px;
        min-height: 44px;
      }
      .prompts {
        margin-top: 20px;
      }
      .composer {
        margin: 0 22px 18px;
        border: 1px solid var(--control);
        border-radius: 10px;
        background: var(--paper);
        padding: 10px;
        display: flex;
        align-items: flex-end;
        gap: 12px;
      }
      .composer textarea {
        border: 0;
        outline-offset: 0;
        min-height: 65px;
        height: 65px;
        resize: none;
        padding: 7px 5px;
        flex: 1;
      }
      .composer .btn {
        flex: 0 0 auto;
      }
      .chat-foot {
        margin: 0 22px 14px;
        font-size: 12px;
        color: var(--muted);
      }
      .question {
        padding: 12px 16px;
        background: var(--subtle);
        border-radius: 8px;
        margin-bottom: 24px;
        max-width: 85%;
        margin-inline-start: auto;
        font-size: 14px;
      }
      .answer {
        font-size: 16px;
        line-height: 1.8;
        max-width: 66ch;
      }
      .answer h3 {
        margin-bottom: 10px;
        font-size: 19px;
      }
      .answer .tag {
        margin-bottom: 10px;
      }
      .citation {
        display: inline-flex;
        gap: 7px;
        align-items: center;
        border: 0;
        background: var(--blue-soft);
        color: var(--blue-ink);
        padding: 6px 9px;
        border-radius: 4px;
        min-height: 36px;
        font-size: 13px;
        font-weight: 650;
        margin-top: 14px;
      }
      .citation:hover {
        background: var(--hover);
      }
      .margin-panel {
        border-top: 2px solid var(--blue);
        background: var(--annotation);
        padding: 22px 20px;
        min-height: 270px;
      }
      .margin-panel h2 {
        font-size: 17px;
      }
      .margin-panel h3 {
        margin-top: 26px;
      }
      .margin-panel p {
        font-size: 14px;
        color: var(--secondary);
        margin-top: 12px;
      }
      .margin-panel blockquote {
        font-size: 15px;
        line-height: 1.8;
        margin: 18px 0 0;
      }
      .margin-panel .source-rule {
        height: 1px;
        background: var(--line);
        margin: 20px 0;
      }
      .source-inspector {
        animation: source-reveal var(--signature) var(--ease);
      }
      .source-quote {
        background: var(--blue-soft);
        padding: 12px;
        border-radius: 4px;
        animation: annotation-arrive 450ms var(--ease);
      }
      .source-inspector :focus-visible {
        outline: 3px solid var(--blue);
      }
      .work-title {
        margin-bottom: 20px;
      }
      .studio-grid {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 28px;
      }
      .config {
        display: grid;
        gap: 18px;
        padding: 24px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .config h2 {
        font-size: 19px;
      }
      .config details {
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }
      .config summary {
        font-size: 14px;
        color: var(--blue);
        cursor: pointer;
        min-height: 32px;
      }
      .config details .stack {
        margin-top: 14px;
      }
      .result {
        min-height: 430px;
      }
      .result.empty .paper-body {
        min-height: 350px;
        display: flex;
        align-items: center;
      }
      .result .reading-empty {
        height: auto;
      }
      .result-content {
        animation: result-arrive 280ms var(--ease);
      }
      .source-footer {
        border-top: 1px solid var(--line);
        padding: 14px 24px;
        color: var(--muted);
        font-size: 13px;
      }
      .flashcard {
        min-height: 220px;
        width: 100%;
        background: var(--paper);
        border: 1px solid var(--control);
        border-radius: 10px;

  <body>
    <!-- THESIS: Open Folio reading and annotation, an expansion of UniMind's supplied identity.
OWN-WORLD: Dark navigation spine; neutral reading paper; blue annotation margin; Manrope/Noto Arabic; coordinated SVG controls.
STORY: Find a unit, study against its sources, produce a bounded artifact, or review an exact operational change.
FIRST VIEWPORT: A 192px navigation spine, contextual unit tabs, bounded reading workspace and a visible primary action. Mobile uses an identity bar and task navigation.
FORM: Existing brief-pinned Folio direction, refined; no replacement-world seed. All data and outcomes are synthetic.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance. For this unapproved proposal the design contract is design-system.md; canonical DESIGN.md is read-only. -->
    <a class="skip" href="#main">Skip to content</a>
    <header class="reviewbar" aria-label="Design review controls">
      <div class="reviewtitle">
        <strong>Open Folio · refinement</strong
        ><small>Proposal · synthetic · no services</small>
      </div>
      <div class="reviewcontrols">
        <label
          ><span>Screen</span
          ><select id="screen" aria-label="Review screen">
            <option value="shelf">Subjects</option>

        <label
          ><span>Locale</span
          ><select id="locale" aria-label="Review locale">
            <option value="en">English</option>
            <option value="ar">العربية</option>
          </select></label
        >
        <label
          ><span>Motion</span
          ><select id="motion" aria-label="Review motion">
            <option value="full">Full</option>
            <option value="reduced">Reduced</option>
          </select></label

      </div>
    </header>
    <div id="root"></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div
      id="announcement"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></div>
    <script>
      const $ = (s) => document.querySelector(s);
      const initial = new URLSearchParams(location.search);
      const state = {
        screen: initial.get("screen") || "shelf",
        theme: initial.get("theme") || "light",
        locale: initial.get("locale") || "en",
        motion: initial.get("motion") || "full",
        role: initial.get("role") || "student",
        chat: "empty",
        question: "",
        cardBack: false,
        studio: "empty",
        type: "summary",
        output: "en",
        topic: "Study sequence",
        intake: "empty",
        rights: false,
        filter: "all",
        selected: null,
        sourceOpen: false,
        depth: "concise",
        size: "short",
        sourceTitle: "Synthetic anatomy handout",
        sourceDescription: "Synthetic teaching fixture",
        reason: "",
        section: "appearance",
        epoch: 0,
      };
      const T = (en, ar) => (state.locale === "ar" ? ar : en);
      const esc = (x) =>
        String(x).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const paths = {
        book: "M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4z M20 4h-4a3 3 0 0 0-3 3v14a4 4 0 0 1 4-2h3z",
        shelf: "M4 4v16h16 M8 5v11h3V5z M14 6l3-1 3 10-3 1z",
        chat: "M4 4h16v12H9l-5 4z M8 8h8 M8 12h5",
        studio: "M4 5h16v14H4z M8 9h8 M8 13h4 M16 16v5 M13.5 18.5h5",
        quiz: "M5 3h14v18H5z M9 8l1.5 1.5L14 6 M9 14h6 M9 17h4",
        arrow: "M5 12h14 M14 7l5 5-5 5",
        back: "M19 12H5 M10 7l-5 5 5 5",
        file: "M6 3h8l4 4v14H6z M14 3v5h4 M9 12h6 M9 16h4",
        user: "M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 21v-2a8 8 0 0 1 16 0v2",
        search: "M16 10a6 6 0 1 1-12 0 6 6 0 0 1 12 0 M14.5 14.5L21 21",
        check: "M5 12l4 4L19 6",
        close: "M6 6l12 12 M18 6L6 18",
        clock: "M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M12 6v6l4 2",
        upload: "M12 16V3 M7 8l5-5 5 5 M4 15v6h16v-6",
        shield: "M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M8 12l3 3 5-6",
        menu: "M4 6h16 M4 12h16 M4 18h16",
        info: "M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M12 10v6 M12 7h.01",
        alert: "M12 3L2 21h20z M12 9v5 M12 17h.01",
        settings: "M4 7h16 M4 17h16 M8 4v6 M16 14v6",
        sun: "M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M12 2v2 M12 20v2 M2 12h2 M20 12h2 M5 5l1 1 M18 18l1 1 M5 19l1-1 M18 6l1-1",
        globe:
          "M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0 M3 12h18 M12 3c5 6 5 12 0 18-5-6-5-12 0-18",
        pause: "M8 4v16 M16 4v16",
      };
      const I = (name, extra = "") =>
        `<svg viewBox="0 0 24 24" class="icon ${extra}" aria-hidden="true"><path d="${paths[name] || paths.info}"/></svg>`;
      const B = (text, action, variant = "", icon = "", extra = "") =>
        `<button ${extra.includes('type="submit"') ? "" : 'type="button"'} class="btn ${variant}" data-action="${action}" ${extra}>${icon ? I(icon, icon === "arrow" || icon === "back" ? "directional" : "") : ""}${text}</button>`;
      const notice = (kind, title, body) =>
        `<div class="notice ${kind} feedback" role="${kind === "error" ? "alert" : "status"}">${I(kind === "success" ? "check" : kind === "error" ? "alert" : "info")}<div><strong>${title}</strong>${body ? `<p>${body}</p>` : ""}</div></div>`;
      const role = () =>
        state.screen === "intake"
          ? "leader"
          : state.screen === "admin"
            ? state.role === "second-admin"
              ? "second-admin"
              : "admin"
            : state.screen === "account"
              ? state.role
              : "student";
      const roleLabel = () =>
        ({
          student: T("Student", "طالب"),
          leader: T("Batch leader", "مسؤول الدفعة"),
          admin: T("Admin", "مسؤول"),
          "second-admin": T("Second admin", "المسؤول الثاني"),
        })[role()];
      const navItem = (label, icon, target, active) =>
        `<button class="navlink ${active ? "active" : ""}" data-screen="${target}" ${active ? 'aria-current="page"' : ""} aria-label="${label}">${I(icon)}<span>${label}</span></button>`;
      function navigation() {
        const r = role();
        if (r === "leader")
          return (
            navItem(
              T("Source intake", "استقبال المصادر"),
              "upload",
              "intake",
              state.screen === "intake",
            ) + navItem(T("History", "السجل"), "clock", "history", false)
          );
        if (r.includes("admin"))
          return (
            navItem(
              T("Decision queue", "قائمة القرارات"),
              "shield",
              "admin",
              state.screen === "admin",
            ) +
            navItem(T("Catalog", "الدليل الدراسي"), "book", "catalog", false) +
            navItem(T("Sources", "المصادر"), "file", "sources", false) +
            navItem(
              T("Usage & capacity", "الاستخدام والسعة"),
              "settings",
              "usage",
              false,
            )
          );
        return (
          navItem(
            T("Study", "المذاكرة"),
            "book",
            "shelf",
            state.screen === "chat" || state.screen === "studio",
          ) +
          navItem(
            T("Subjects", "المواد"),
            "shelf",
            "shelf",
            state.screen === "shelf",
          )
        );
      }
      function shell(body) {
        return `<div class="shell"><aside class="spine"><a class="brand" href="?screen=shelf" aria-label="UniMind"><img src="../concepts/assets/folio-dark.svg" alt="" /><span class="brand-name">UniMind</span></a><nav aria-label="${T("Main navigation", "التنقل الرئيسي")}">${navigation()}</nav><div class="identity"><button class="navlink ${state.screen === "account" ? "active" : ""}" data-screen="account">${I("user")}<span>${T("Account", "الحساب")}</span></button><div class="inline"><span class="avatar" aria-hidden="true">${role() === "student" ? "S" : role() === "leader" ? "L" : role() === "second-admin" ? "A2" : "A"}</span><div class="identity-copy"><strong style="font-size:13px">${roleLabel()}</strong><div class="meta">${T("Synthetic account", "حساب تجريبي")}</div></div></div><p class="wordmark" lang="en" dir="ltr">Study deeper<br />Go further.</p></div></aside><header class="mobilebar"><span class="mobile-brand"><img src="../concepts/assets/folio-dark.svg" alt="" /><span>UniMind</span></span><span class="role-label">${roleLabel()}</span>${B(`<span class="sr-only">${T("Open navigation", "فتح التنقل")}</span>`, "menu", "quiet icon-btn", "menu")}</header><main id="main" class="main" tabindex="-1"><div class="page">${body}</div></main><nav class="bottomnav" aria-label="${T("Primary navigation", "التنقل الأساسي")}"><button data-screen="${role() === "leader" ? "intake" : role().includes("admin") ? "admin" : "shelf"}" class="${state.screen !== "account" ? "active" : ""}">${I(role() === "leader" ? "upload" : role().includes("admin") ? "shield" : "shelf")}<span>${role() === "leader" ? T("Intake", "الاستقبال") : role().includes("admin") ? T("Decisions", "القرارات") : T("Subjects", "المواد")}</span></button><button data-screen="account" class="${state.screen === "account" ? "active" : ""}">${I("user")}<span>${T("Account", "الحساب")}</span></button><button data-action="menu">${I("menu")}<span>${T("More", "المزيد")}</span></button></nav></div>`;
      }
      function unit() {
        return `<div class="breadcrumb">${B(T("Subjects", "المواد"), "subjects", "quiet", "back")}<span>/</span><span>${T("Anatomy", "التشريح")}</span></div><header class="unithead"><div><h1>${T("Anatomy", "التشريح")}</h1><p class="meta">${T("8 sample materials · Ready", "٨ مواد تجريبية · جاهزة")}</p></div>${B(T("Switch unit", "تغيير الوحدة"), "subjects", "quiet", "shelf")}</header><nav class="tabs" aria-label="${T("Unit tools", "أدوات الوحدة")}">${["materials", "chat", "studio", "quiz"].map((s) => `<button data-screen="${s}" ${state.screen === s ? 'aria-current="page"' : ""}>${{ materials: T("Materials", "المواد الدراسية"), chat: T("Chat", "المحادثة"), studio: T("Studio", "الاستوديو"), quiz: T("Quiz", "الاختبار") }[s]}</button>`).join("")}</nav>`;
      }
      function shelf() {
        const subjects = [
          ["Anatomy", "التشريح"],
          ["Biochemistry", "الكيمياء الحيوية"],
          ["Physiology", "علم وظائف الأعضاء"],
          ["Pathology", "علم الأمراض"],
          ["Pharmacology", "علم الأدوية"],
        ];
        return `<header class="page-heading"><h1>${T("Your subjects", "موادك الدراسية")}</h1><p class="muted">${T("Choose a subject. Every answer stays connected to its approved materials.", "اختر مادة. تظل كل إجابة مرتبطة بمصادرها المعتمدة.")}</p></header><div class="collection"><section class="collection-main" aria-label="${T("Subjects", "المواد")}"><div class="spread"><h2>${T("Medicine · Modules", "الطب · الوحدات")}</h2><label class="search">${I("search")}<input type="search" id="subject-search" aria-label="${T("Find a subject", "البحث عن مادة")}" placeholder="${T("Find a subject", "ابحث عن مادة")}" /></label></div><div class="subject-index" id="subject-list">${subjects.map(([en, ar]) => `<button class="subject-row" data-action="open-subject" data-name="${en.toLowerCase()} ${ar}" aria-label="${T("Open " + en, "فتح " + ar)}"><span class="folio-mark" aria-hidden="true"></span><div class="subject-copy"><h3>${T(en, ar)}</h3><p class="meta">${T("8 sample materials", "٨ مواد تجريبية")}</p></div><span class="tag ready">${T("Ready", "جاهزة")}</span>${I("arrow", "directional")}</button>`).join("")}</div><p id="subject-empty" class="notice" hidden>${T("No matching subjects. Try another name.", "لا توجد مواد مطابقة. جرّب اسمًا آخر.")}</p></section><aside class="orientation"><svg class="folio-emblem" viewBox="0 0 180 140" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M25 26h48q17 0 17 16v74q-8-11-22-11H25z M155 26h-48q-17 0-17 16v74q8-11 22-11h43z M36 42h30 M36 53h30 M36 64h23 M107 42h35 M107 53h35 M107 64h25"/><path d="M136 26v28l-7-6-7 6V26" fill="currentColor"/><path d="M18 32v80h50q14 0 22 10 8-10 22-10h50V32" opacity=".45"/></svg><h2>${T("Start with the source.", "ابدأ من المصدر.")}</h2><p>${T("Read your materials, ask a question, then turn what you understand into a study artifact.", "اقرأ موادك، واسأل سؤالًا، ثم حوّل ما فهمته إلى أداة للمذاكرة.")}</p><div class="context-note"><strong>${T("Your academic context", "سياقك الدراسي")}</strong><p class="meta">${T("Medicine · Synthetic cohort", "الطب · مجموعة تجريبية")}</p>${B(T("Edit in Account", "تعديل من الحساب"), "account", "quiet", "settings")}</div></aside></div>`;
      }
      const samplePrompt = () =>
        T(
          "Explain the sample unit's study sequence.",
          "اشرح ترتيب المذاكرة في الوحدة التجريبية.",
        );
      const sampleAnswer = () =>
        T(
          "The synthetic handout says to identify the labelled structures, then compare the two diagrams. This fixed example uses only the sample handout.",
          "الملزمة التجريبية تطلب تحديد الأجزاء المسماة ثم مقارنة الرسمين. هذا مثال ثابت من الملزمة فقط.",
        );
      function sourceContent(reveal = false) {
        return `<div class="source-inspector ${reveal ? "reveal" : ""}"><div class="spread"><h2 tabindex="-1" id="source-heading">${T("Source excerpt", "مقتطف من المصدر")}</h2><span class="pill">${T("Page 3", "صفحة ٣")}</span></div><h3>${T("Synthetic anatomy handout", "ملزمة التشريح التجريبية")}</h3><p class="meta">${T("Approved sample material", "مادة تجريبية معتمدة")}</p><blockquote class="source-quote">${T("Identify the labelled structures, then compare the two diagrams.", "حدد الأجزاء المسماة، ثم قارن الرسمين.")}</blockquote><div class="source-rule"></div><p>${T("The source supports this sequence. It does not specify the timing of either step.", "المصدر يدعم هذا الترتيب، لكنه لا يحدد وقت كل خطوة.")}</p></div>`;

      function margin() {

      function chatBody() {
        if (state.chat === "loading")
          return `<p class="question">${esc(state.question)}</p><div class="reading-empty" role="status" aria-live="polite"><h2>${T("Checking the sample materials…", "جارٍ مراجعة المواد التجريبية…")}</h2><p>${T("Your question remains here. You can cancel this example.", "يبقى سؤالك هنا. يمكنك إلغاء هذا المثال.")}</p><div class="busy-line" style="width:100%"></div>${B(T("Cancel", "إلغاء"), "cancel-chat", "quiet")}</div>`;

            B(
              T("Retry answer", "إعادة تحميل الإجابة"),
              "retry-chat",
              "quiet",
              "arrow",
            )
          );

              state.reason = "";
              render();
              if (matchMedia("(max-width:600px)").matches)
                $("#main").scrollTop = 0;
            }),
        );
        scope.querySelectorAll("[data-filter]").forEach(
          (el) =>
            (el.onclick = () => {
              state.filter = el.dataset.filter;
              render();
            }),
        );
        scope.querySelectorAll("[data-setting]").forEach(
          (el) =>
            (el.onclick = () => {
              state.section = el.dataset.setting;
              render();
            }),
        );
        if ($("#subject-search"))
          $("#subject-search").oninput = (e) => {
            let count = 0;
            document.querySelectorAll(".subject-row").forEach((row) => {
              const show = row.dataset.name.includes(
                e.target.value.toLowerCase(),
              );
              row.hidden = !show;
              row.style.display = show ? "flex" : "none";
              if (show) count++;
            });
            $("#subject-empty").hidden = count !== 0;
            $("#subject-empty").style.display = count ? "none" : "flex";
          };
        if ($("#decision-search"))
          $("#decision-search").oninput = (e) => {
            document
              .querySelectorAll(".queue-row")
              .forEach(
                (row) =>
                  (row.style.display = row.textContent
                    .toLowerCase()
                    .includes(e.target.value.toLowerCase())
                    ? "grid"
                    : "none"),
              );
          };
        if ($("#chat-form"))
          $("#chat-form").onsubmit = (e) => {
            e.preventDefault();
            if ($("#message").value.trim()) startChat();
            else $("#message").focus();
          };
        if ($("#studio-form"))
          $("#studio-form").onsubmit = (e) => {
            e.preventDefault();
            startStudio();
          };
        if ($("#artifact"))
          $("#artifact").onchange = (e) => {
            state.type = e.target.value;
            state.studio = "empty";
            state.epoch++;
            render();
          };
        if ($("#output-language"))
          $("#output-language").onchange = (e) => {
            state.output = e.target.value;
          };
        if ($("#topic"))
          $("#topic").oninput = (e) => (state.topic = e.target.value);
        if ($("#rights"))
          $("#rights").onchange = (e) => {
            state.rights = e.target.checked;
            $("[data-action=submit-file]").disabled = !state.rights;
          };
        if ($("#reason"))
          $("#reason").oninput = (e) => {
            state.reason = e.target.value;
            $("[data-action=review-change]").disabled = !state.reason.trim();
          };
        for (const [id, key] of [
          ["account-theme", "theme"],
          ["account-locale", "locale"],
          ["account-motion", "motion"],
          ["account-role", "role"],
        ])
          if ($("#" + id))
            $("#" + id).onchange = (e) => {
              state[key] = e.target.value;
              render();
              toast(
                T(
                  "Review preference updated locally.",
                  "تم تحديث تفضيل المراجعة محليًا.",
                ),
              );
            };
        if ($("#specimen-form"))
          $("#specimen-form").onsubmit = (e) => {
            e.preventDefault();
            const input = $("#specimen-title");
            if (!input.value.trim()) {
              input.setAttribute("aria-invalid", "true");
              $("#specimen-error").innerHTML = notice(
                "error",
                T("Add a source title.", "أضف عنوان المصدر."),
                "",
              );
              input.focus();
            } else {
              input.removeAttribute("aria-invalid");
              $("#specimen-error").innerHTML = notice(
                "success",
                T(
                  "Title accepted in this example.",
                  "تم قبول العنوان في هذا المثال.",
                ),
                "",
              );
            }
          };
      }
      function render() {
        document.documentElement.dataset.screen = state.screen;
        if (state.screen === "intake") state.role = "leader";
        if (state.screen === "admin" && !state.role.includes("admin"))
          state.role = "admin";
        if (["shelf", "chat", "studio"].includes(state.screen))
          state.role = "student";
        document.documentElement.dataset.theme = state.theme;
        document.documentElement.dataset.motion = state.motion;
        document.documentElement.lang = state.locale;
        document.documentElement.dir = state.locale === "ar" ? "rtl" : "ltr";
        for (const k of ["screen", "theme", "locale", "motion"])
          $("#" + k).value = state[k];
        $("#root").innerHTML = shell(
          { shelf, chat, studio, intake, admin, account, states: specimens }[
            state.screen
          ](),
        );
        bind();
        const q = new URLSearchParams({
          screen: state.screen,
          theme: state.theme,
          locale: state.locale,
          motion: state.motion,
          role: state.role,
        });
        history.replaceState(null, "", "?" + q);
      }
      for (const k of ["screen", "theme", "locale", "motion"])
        $("#" + k).onchange = (e) => {
          state[k] = e.target.value;
          if (k === "screen") state.epoch++;
          render();
        };
      render();
    </script>
  </body>
</html>
