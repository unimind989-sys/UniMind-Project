name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      database_feedback:
        description: Run only the guarded disposable database job before opening a PR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci_selector:
    name: ci-selector
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      dependency_audit: ${{ steps.select.outputs.dependency_audit }}
      application: ${{ steps.select.outputs.application }}
      database_ci: ${{ steps.select.outputs.database_ci }}
      all_skipped: ${{ steps.select.outputs.all_skipped }}
    steps:
      - name: Check out the exact candidate and its comparison commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Activate the pinned package manager
        run: corepack enable
      - name: Install from the immutable lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Verify the governed workflow
        run: corepack pnpm verify:ci-workflow
      - name: Select exact-head CI jobs
        id: select
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DATABASE_FEEDBACK: ${{ inputs.database_feedback }}
        run: corepack pnpm exec tsx scripts/select-ci-jobs.ts
      - name: Verify safe documentation without the heavyweight jobs
        if: steps.select.outputs.all_skipped == 'true'
        run: |
          corepack pnpm exec prettier . --check
          corepack pnpm scan:secrets
          corepack pnpm lint:agents

  dependency-audit:
    needs: ci_selector
    if: always() && github.event_name == 'pull_request' && (needs.ci_selector.result != 'success' || needs.ci_selector.outputs.dependency_audit == 'RUN')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Activate the pinned package manager
        run: corepack enable
      - name: Reject known high or critical production vulnerabilities
        run: corepack pnpm audit --audit-level high --prod

  static:
    name: static
    needs: ci_selector
    if: always() && (needs.ci_selector.result != 'success' || needs.ci_selector.outputs.application == 'RUN')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: static-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Activate the pinned package manager
        run: corepack enable
      - name: Install from the immutable lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Check formatting
        run: corepack pnpm format:check
      - name: Lint
        run: corepack pnpm lint
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Typecheck a fresh project
        run: corepack pnpm typecheck:fresh
      - name: Check module boundaries
        run: corepack pnpm check:boundaries
      - name: Check SQL conventions
        run: corepack pnpm check:sql
      - name: Verify the governed workflow
        run: corepack pnpm verify:ci-workflow
      - name: Lint agent instructions
        run: corepack pnpm lint:agents
      - name: Scan for repository secrets
        run: corepack pnpm scan:secrets
      - name: Build with a safe synthetic environment
        run: corepack pnpm test:env-build

  node_tests:
    name: node-tests
    needs: ci_selector
    if: always() && (needs.ci_selector.result != 'success' || needs.ci_selector.outputs.application == 'RUN')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: node-tests-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Activate the pinned package manager
        run: corepack enable
      - name: Install from the immutable lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Run unit, integration, security, evaluation and load tests
        run: corepack pnpm test:node
      - name: Upload sanitized local reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: e2e (shard ${{ matrix.shard }})
    needs: ci_selector
    if: always() && (needs.ci_selector.result != 'success' || needs.ci_selector.outputs.application == 'RUN')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    concurrency:
      group: e2e-${{ matrix.shard }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Activate the pinned package manager
        run: corepack enable
      - name: Install from the immutable lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Install the pinned Chromium runtime
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run the credential-free browser suite shard
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: corepack pnpm test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload sanitized local reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-reports-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  e2e_demo:
    name: e2e-demo (shard ${{ matrix.shard }})
    needs: ci_selector
    if: always() && (needs.ci_selector.result != 'success' || needs.ci_selector.outputs.application == 'RUN')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: e2e-demo-${{ matrix.shard }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Activate the pinned package manager
        run: corepack enable
      - name: Install from the immutable lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Install the pinned Chromium runtime
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run the credential-free product demo shard
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: corepack pnpm test:e2e:demo --fully-parallel --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload sanitized local reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-demo-test-reports-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  application:
    needs: [ci_selector, static, node_tests, e2e, e2e_demo]
    if: always() && (needs.ci_selector.result != 'success' || needs.ci_selector.outputs.application == 'RUN')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every application job to pass
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          NODE_TESTS_RESULT: ${{ needs.node_tests.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_DEMO_RESULT: ${{ needs.e2e_demo.result }}
        run: |
          test "$STATIC_RESULT" = success || { echo "static: $STATIC_RESULT"; exit 1; }
          test "$NODE_TESTS_RESULT" = success || { echo "node_tests: $NODE_TESTS_RESULT"; exit 1; }
          test "$E2E_RESULT" = success || { echo "e2e: $E2E_RESULT"; exit 1; }
          test "$E2E_DEMO_RESULT" = success || { echo "e2e_demo: $E2E_DEMO_RESULT"; exit 1; }

  database-ci:
    needs: ci_selector
    if: always() && (needs.ci_selector.result != 'success' || needs.ci_selector.outputs.database_ci == 'RUN')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: database-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Activate the pinned package manager
        run: corepack enable
      - name: Install from the immutable lockfile
        run: corepack pnpm install --frozen-lockfile
      - name: Start and verify the disposable database and Auth stack
        id: database_setup
        run: |
          corepack pnpm db:ci:start
          corepack pnpm db:ci:upgrade
          corepack pnpm db:ci:reset
          corepack pnpm db:ci:reset
          corepack pnpm db:ci:migrations
      - name: Run pgTAP and database contracts
        if: ${{ always() && steps.database_setup.outcome == 'success' }}
        run: corepack pnpm db:ci:test
      - name: Run database advisors
        if: ${{ always() && steps.database_setup.outcome == 'success' }}
        run: corepack pnpm db:ci:advisors
      - name: Generate database types
        if: ${{ always() && steps.database_setup.outcome == 'success' }}
        run: corepack pnpm db:ci:types
      - name: Check generated-type parity
        if: ${{ always() && steps.database_setup.outcome == 'success' }}
        run: corepack pnpm db:types:check
      - name: Run database integration
        if: ${{ always() && steps.database_setup.outcome == 'success' }}
        run: corepack pnpm test:integration:database
      - name: Install the pinned Chromium runtime for the disposable role gate
        if: ${{ always() && steps.database_setup.outcome == 'success' }}
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run authenticated product-shell browser contracts
        if: ${{ always() && steps.database_setup.outcome == 'success' }}
        run: corepack pnpm test:e2e:database
      - name: Remove the disposable stack and volumes
        if: always()
        run: corepack pnpm db:ci:stop
      - name: Upload sanitized database reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-ci-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            src/types/database.generated.ts
          if-no-files-found: warn
          retention-days: 7
